[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beltrami-denoising"
version = "1.1.0"
description = "Beltrami image denoising and reproducible patch-space experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aaron Wetzler"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9"]

[project.urls]
Repository = "https://github.com/twerdster/beltrami-denoising"
Documentation = "https://github.com/twerdster/beltrami-denoising#readme"
Issues = "https://github.com/twerdster/beltrami-denoising/issues"

[project.optional-dependencies]
deep = ["torch>=2.1", "h5py>=3.8"]
test = ["pytest>=7"]
plots = ["matplotlib>=3.7"]

[project.scripts]
beltrami = "beltrami.cli:main"
beltrami-deep = "beltrami.deep.cli:main"
beltrami-points = "beltrami.pointcloud:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beltrami = ["data/*.json", "data/*.npz"]
"beltrami.deep" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
